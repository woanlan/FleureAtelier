<!-- Khung ứng dụng Mobile-First 430px căn giữa (kể cả trên Desktop) chuẩn yêu cầu ASM 1 -->
<div
  class="atelier-page-shell website"
  [inert]="atelier.drawerOpen()"
  [attr.inert]="atelier.drawerOpen() ? '' : null"
>
  <!-- Liên kết bỏ qua điều hướng hỗ trợ người dùng bàn phím & trình đọc màn hình -->
  <a class="skip-link" href="#main-content">Chuyển tới nội dung chính</a>

  <!-- Thanh điều hướng đầu trang FLEURÉ — Flower Boutique -->
  <app-atelier-header />

  <!-- Khung hiển thị nội dung từng route lazy-loaded -->
  <main id="main-content" class="atelier-main" tabindex="-1">
    <router-outlet />
  </main>

  <!-- Chân trang thông tin xưởng & liên hệ -->
  <app-atelier-footer />

  <!-- Thanh điều hướng đáy cố định (Mobile Bottom Navigation 430px) -->
  <app-bottom-nav />
</div>

<!-- Ngăn kéo đặt hoa kem ấm & Thiệp gấp 3D trực tiếp căn theo khung 430px -->
<app-order-drawer />

<!-- Thanh thông báo Toast nổi kèm nút Hoàn tác khi xóa sản phẩm khỏi giỏ -->
<app-toast-bar />
