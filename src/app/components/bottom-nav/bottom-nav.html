<nav class="bottom-nav" aria-label="Điều hướng nhanh cuối màn hình">
  @for (tab of tabs; track tab.label) {
    @if (tab.fragment) {
      <a
        [routerLink]="[tab.route]"
        [fragment]="tab.fragment"
        class="bottom-nav-item"
        (click)="onTabClick($event, tab)"
      >
        <span class="bottom-nav-icon-wrap">
          <app-icon [name]="tab.icon" [size]="20" />
        </span>
        <span class="bottom-nav-label">{{ tab.label }}</span>
      </a>
    } @else {
      <a
        [routerLink]="[tab.route]"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: !!tab.exact }"
        class="bottom-nav-item"
      >
        <span class="bottom-nav-icon-wrap">
          <app-icon [name]="tab.icon" [size]="20" />
          @if (tab.isCart && atelier.cartCount() > 0) {
            <span class="bottom-nav-badge tabular-nums" aria-hidden="true">
              {{ atelier.cartCount() }}
            </span>
          }
        </span>
        <span class="bottom-nav-label">{{ tab.label }}</span>
      </a>
    }
  }
</nav>
