<!-- Thanh điều hướng cố định đầu trang FLEURÉ — Flower Boutique -->
<header class="header-shell">
  <div class="atelier-container header-bar">
    <!-- Thương hiệu góc trái: về đầu trang -->
    <a
      href="#top"
      class="brand-link"
      (click)="navigateToSection($event, 'top')"
      aria-label="FLEURÉ Flower Boutique, về đầu trang"
    >
      <span class="brand-name">FLEURÉ</span>
      <span class="brand-subtitle">Flower Boutique</span>
    </a>

    <!-- Điều hướng trung tâm trên màn hình rộng (> 860px) -->
    <nav class="desktop-nav" aria-label="Điều hướng chính">
      <ul class="desktop-nav-list">
        @for (item of navItems; track item.sectionId) {
          <li class="desktop-nav-item">
            <a
              [href]="item.href"
              class="desktop-nav-link"
              (click)="navigateToSection($event, item.sectionId)"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Cụm hành động bên phải: Nút Đặt hoa & Nút mở menu trên màn hình hẹp -->
    <div class="header-actions">
      <button
        type="button"
        class="order-cta-btn"
        [attr.aria-label]="orderCtaAriaLabel()"
        (click)="openQuickOrder()"
      >
        <span>Đặt hoa</span>
        @if (atelier.totalCustomStems() > 0) {
          <span class="stem-count-badge tabular-nums" aria-hidden="true">
            {{ atelier.totalCustomStems() }}
          </span>
        }
      </button>

      <button
        #mobileMenuToggle
        type="button"
        class="mobile-menu-toggle"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-nav-drawer"
        aria-label="Mở menu điều hướng"
        (click)="toggleMobileMenu()"
      >
        <app-icon [name]="mobileMenuOpen() ? 'x' : 'menu'" [size]="20" />
      </button>
    </div>
  </div>

  <!-- Ngăn trượt điều hướng cho màn hình <= 860px (trượt mượt bằng grid-template-rows) -->
  <div
    id="mobile-nav-drawer"
    class="mobile-drawer"
    [class.is-open]="mobileMenuOpen()"
    [inert]="!mobileMenuOpen()"
  >
    <div class="mobile-drawer-inner">
      <nav class="atelier-container mobile-nav" aria-label="Điều hướng di động">
        <ul class="mobile-nav-list">
          @for (item of navItems; track item.sectionId) {
            <li class="mobile-nav-item">
              <a
                [href]="item.href"
                class="mobile-nav-link"
                (click)="navigateToSection($event, item.sectionId)"
              >
                <span>{{ item.label }}</span>
                <app-icon name="chevron-right" [size]="16" />
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>
  </div>
</header>

<!-- Lớp màn mờ đóng menu khi chạm ra ngoài trên thiết bị di động (luật I21) -->
@if (mobileMenuOpen()) {
  <div class="mobile-backdrop" aria-hidden="true" (click)="closeMobileMenu()"></div>
}
